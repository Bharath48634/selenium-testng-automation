name: Selenium Automation Tests

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Selenium Tests
        run: mvn clean test

      - name: Send Test Result to n8n
        if: always()
        run: |
          if [ "${{ steps.selenium_tests.outcome }}" = "success" ]; then
            STATUS="success"
            MESSAGE="All Selenium tests passed"
          else
            STATUS="failure"
            MESSAGE="Selenium tests failed in GitHub Actions"
          fi

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"project\": \"selenium-testng-automation\",
              \"status\": \"$STATUS\",
              \"test\": \"LoginTest\",
              \"message\": \"$MESSAGE\"
            }" \
            "${{ secrets.N8N_WEBHOOK_URL }}"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            test-output/
            target/
            screenshots/

      - name: Mark workflow as failed if tests failed
        if: steps.selenium-tests.outcome == 'failure'
        run: exit 1
